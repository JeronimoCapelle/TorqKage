# ==============================================================================
# project.toml — Rust Ecosystem Configuration Template
# ==============================================================================

[project]
name = "my-rust-project"
language = "rust"
version = "0.1.0"

[workspace]
containers = ["crates", "packages"]
ignored_paths = [
    "target",
    ".tkg/state",
    ".tkg/workspaces",
]

[sandbox]
bind_mounts = [
    "target",
]

[gates.compilation]
command = ["cargo", "check", "--all-targets"]
timeout_seconds = 30
failure_message = "Project compilation failed (`cargo check --all-targets`). Fix type errors and syntax before proceeding."
error_regex = "error[E"
explain_command = ["rustc", "--explain"]

[gates.tests]
command = ["cargo", "test", "--no-run"]
timeout_seconds = 45
failure_message = "Test suite compilation failed (`cargo test --no-run`). Ensure test functions and harness compile cleanly."
error_regex = "error[E"
explain_command = ["rustc", "--explain"]

[gates.linter]
command = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
timeout_seconds = 30
failure_message = "Linter check failed (`cargo clippy`). Adhere to all pedantic linter and style guidelines."
error_regex = "error[E"

[gates.fmt]
command = ["cargo", "fmt", "--", "--check"]
timeout_seconds = 15
failure_message = "Declarative formatter check failed (`cargo fmt`)."

[environment]
CARGO_TARGET_DIR = "./target"
CARGO_TERM_COLOR = "never"
RUST_BACKTRACE = "1"

[docs]
paths = ["docs", "ARCHITECTURE.md"]
tool_name = "query_project_spec"

[policies.syntax]
line_comments = ["//"]
block_comments = [{ start = "/*", end = "*/" }]
test_attributes = ["test", "cfg(test", "tokio::test", "rstest"]
test_prefixes = ["test_"]
