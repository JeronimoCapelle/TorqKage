[book]
authors = ["Jerónimo Capelle"]
language = "en"
src = "src"
title = "The TorqKage Engine Manual"
description = "High-assurance systems programming toolkit, bounded declarative MCP daemon, and Ratatui control deck for popular agent execution harnesses"

[output.html]
git-repository-url = "https://github.com/JeronimoCapelle/torqkage"
edit-url-template = "https://github.com/JeronimoCapelle/torqkage/edit/main/docs/{path}"
site-url = "/torqkage/"
default-theme = "ayu"
preferred-dark-theme = "ayu"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
