# ==============================================================================
# hooks.toml — Declarative Hybrid Lifecycle Hook Configuration for agy-hooks
# ==============================================================================
#
# PURPOSE & ARCHITECTURAL ROLE:
# ------------------------------
# `hooks.toml` defines the execution pipeline and guard rules for Antigravity
# lifecycle hooks. The agy-hooks engine evaluates native high-assurance Rust
# primitives in-memory (<1ms latency) alongside optional declarative custom
# checks, completely decoupling safety policies from compiled code.
#
# INTERACTION WITH ANTIGRAVITY & AGY-SUITE:
# ----------------------------------------
# 1. Host Event Binding (`hooks.json`):
#    - `PreToolUse`:      Invokes `agy-hooks pre-tool-use` before ANY tool call executes.
#    - `PreInvocation`:   Invokes `agy-hooks detect-wip` before each agent turn.
#    - `SessionStart`:    Invokes `agy-hooks inject-wake` on turn 1 to provide context.
#    - `Stop`:            Invokes `agy-hooks record-handoff` on session termination.
#
# 2. Decision Outcomes returned to Antigravity:
#    - `allow`: Operation proceeds immediately without disruption.
#    - `deny`:  Operation is blocked; the rejection reason is returned to the agent.
#    - `ask`:   Operation is paused; operator confirmation prompt [y/n] is shown.
#
# 3. Discovery Order:
#    1. `<project_root>/.agy/hooks.toml`               (Workspace override)
#    2. `<project_root>/hooks.toml`                    (Repository root)
#    3. `<project_root>/plugins/agy-suite/hooks.toml`  (Plugin bundle default)
#    4. `~/.gemini/config/plugins/agy-suite/hooks.toml`(Global installed fallback)
#
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. PRE-TOOL-USE PIPELINE
# ------------------------------------------------------------------------------
[pre_tool_use]
# The ordered pipeline of safety primitives evaluated sequentially on every tool call.
# Evaluation halts immediately on the first non-allow decision (first 'deny' or 'ask').
#
# Available Native Rust Primitives:
#   - "circuit_breaker":   Blocks mutating tools if consecutive compilation failures
#                          exceed the configured strike threshold (`max_strikes`).
#   - "manifest_guard":    Protects build manifests and proc-macros (`Cargo.toml`,
#                          `build.rs`, `package.json`, etc.) from unauthorized agent
#                          mutation, closing arbitrary code execution (RCE) vectors.
#   - "subagent_admission": Intercepts `invoke_subagent`, parses the target agent's
#                          frontmatter `pre_launch_checks`, and executes matching
#                          gates from `project.toml`. Denies admission if gates fail.
#   - "vcs_conflicts":     Inspects the workspace for Jujutsu (`<<<<<<<`) or Git
#                          conflict markers before compiling/testing. Blocks execution
#                          if merge conflicts exist.
#   - "tool_policy":       Checks `mutating` and `require_permission_gate` flags in
#                          `tools.toml`. Emits `ask` to request operator confirmation
#                          if supervised execution is mandated.
#
# Recommended pipeline order:
#   1. circuit_breaker   (Fail-fast on repeated compiler loops)
#   2. manifest_guard     (Deterministic path/manifest security)
#   3. path_policies      (Enforce agent directory boundaries and content policies)
#   4. subagent_admission (Enforce quality prerequisites before agent spawn)
#   5. vcs_conflicts      (Ensure tree integrity before running compilation)
#   6. tool_policy        (Prompt operator only if all prior guards pass)
pipeline = [
    "circuit_breaker",
    "manifest_guard",
    "path_policies",
    "subagent_admission",
    "vcs_conflicts",
    "tool_policy",
]

# Gate Requirements:
# ------------------
# Tools explicitly declare their required gates in `tools.toml` (e.g.
# `require_gates = ["vcs_conflicts"]`), either at the category level
# (e.g. `[categories.compilation]`, `[categories.testing]`, `[categories.release]`)
# or directly on individual tool declarations.
#
# Available Native Gates:
#   - "vcs_conflicts":     Blocks execution if Git or Jujutsu merge conflict markers exist.
#   - "circuit_breaker":   Blocks mutating tools when strike threshold is exceeded.
#   - "manifest_guard":    Blocks mutations to protected project manifests/build scripts.
#   - "subagent_admission": Validates admission gates before launching subagents.
#   - "tool_policy":       Requires interactive confirmation for mutating or gated tools.
#
# Available Custom Gates:
#   - Any custom check name declared below in `[[pre_tool_use.custom_checks]]`.
#   - Any compiler gate defined in `project.toml` (`[gates.<name>]`).


# ------------------------------------------------------------------------------
# 2. CIRCUIT BREAKER CONFIGURATION
# ------------------------------------------------------------------------------
# Prevents autonomous agents from entering infinite compile-fail-retry loops
# by tracking consecutive compiler failures in `.agy/state/circuit_breaker.json`.
[circuit_breaker]
# Set `enabled = false` to completely deactivate circuit breaker enforcement.
enabled = true

# Maximum number of consecutive compiler strikes permitted before tripping.
# When tripped:
#   - Non-mutating diagnostic tools (`read_project_file`, `query_project_spec`) remain ALLOWED.
#   - Mutating tools (`modify_code`, `write_file`) are DENIED with instructions to diagnose.
# Set `max_strikes = 0` to disable strike counting.
# Reset strikes in agy-ctrl using Ctrl+R, or by achieving a clean compilation run.
max_strikes = 2


# ------------------------------------------------------------------------------
# 3. MANIFEST MUTATION GUARD
# ------------------------------------------------------------------------------
# Defends against prompt-injection and proc-macro code execution vulnerabilities.
# In languages like Rust, C, Zig, and Node, build manifests can execute arbitrary
# code during build time (`build.rs`, `package.json` install scripts, CMake).
# Manifest guard blocks agent write tools from altering these files unless
# explicitly supervised.
[manifest_guard]
# Set `enabled = false` to deactivate manifest protection.
enabled = true

# File patterns and filenames protected against unauthorized agent mutation.
protected_patterns = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "CMakeLists.txt",
    "meson.build",
    "package.json",
    "build.zig",
    "go.mod",
    "Makefile",
]

# Explicit tool names to protect.
# If left empty `[]`, agy-hooks dynamically inspects `tools.toml` and protects
# ALL tools flagged with `mutating = true`, as well as host IDE built-in mutation tools
# (`write_file`, `edit_file`, `modify_code`).
# Target file paths are automatically detected across all argument conventions (e.g. `path`,
# `Path`, `destination`, `file`, etc.) without requiring parameter name configuration.
protected_tools = []


# ------------------------------------------------------------------------------
# 4. WORK-IN-PROGRESS (WIP) CHANGE DETECTOR
# ------------------------------------------------------------------------------
# Evaluated on `PreInvocation` (before each agent turn). Computes workspace diffs
# and presents the agent with turn-by-turn awareness of what changed on disk.
[wip]
# Set `enabled = false` to disable turn-by-turn diff notices.
enabled = true

# Maximum number of modified files displayed in the WIP prompt preview.
max_preview_files = 4


# ------------------------------------------------------------------------------
# 5. SESSION START CONTEXT & WAKE-UP INJECTION
# ------------------------------------------------------------------------------
# Evaluated on `SessionStart` (turn 1). Injects essential workspace state,
# previous handoff notes, active Jujutsu commit/branch info, and documentation paths.
[session_start]
# Set `enabled = false` to disable turn-1 context injection.
enabled = true

# Injects last session handoff notes, active JJ change ID, branch, and status summary.
inject_wake_state = true

# Injects project documentation paths and recommended search tool from `project.toml`.
inject_documentation = true

# ------------------------------------------------------------------------------
# 5b. DECLARATIVE WAKE CONTEXT INJECTIONS
# ------------------------------------------------------------------------------
# Executes pre-configured host CLI queries on SessionStart (Turn 1) and injects
# structured output directly into the agent's initial prompt.
#
# Eliminates token waste and round-trip tool execution for standard triage data
# (e.g. diffs, commit logs, VCS state) that the agent unconditionally requires.

[[session_start.injections]]
name = "finisher_diff_summary"
matcher = "finisher"
command = ["jj", "diff", "--summary"]
max_lines = 40
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Active Workspace Diff Summary\n"
fallback = "Working copy has no uncommitted modifications."

[[session_start.injections]]
name = "finisher_parent_commit"
matcher = "finisher"
command = ["jj", "show", "@-", "--stat"]
max_lines = 30
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Parent Revision (@-) Summary\n"

[[session_start.injections]]
name = "finisher_git_status"
matcher = "finisher"
command = ["git", "status", "--short"]
max_lines = 20
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Git Working Tree Status\n"
fallback = "Git tree clean (0 uncommitted changes)."

[[session_start.injections]]
name = "finisher_unreleased_changelog"
matcher = "finisher"
command = ["git-cliff", "--unreleased", "--strip", "header", "HEAD~8..HEAD"]
max_lines = 25
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Unreleased Conventional Commits Preview (git-cliff)\n"
fallback = "No unreleased conventional commits found in recent range."

[[session_start.injections]]
name = "copilot_vcs_status"
matcher = "copilot"
command = ["jj", "status", "--no-pager"]
max_lines = 15
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Active Jujutsu VCS Status\n"
fallback = "VCS status clean."

[[session_start.injections]]
name = "planner_workspace_topology"
matcher = "planner"
command = ["cargo", "tree", "--depth", "0", "--workspace"]
max_lines = 20
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Workspace Member Crates\n"
fallback = "Single-package workspace."

[[session_start.injections]]
name = "spec_checker_dirty_files"
matcher = "spec-checker"
command = ["git", "status", "--short"]
max_lines = 25
timeout_seconds = 5
prefix = "### [AUTOMATED WAKE CONTEXT]: Active Files Awaiting Spec Audit\n"
fallback = "No uncommitted modifications in repository."


# ------------------------------------------------------------------------------
# 6. SESSION STOP HANDOFF RECORDING
# ------------------------------------------------------------------------------
# Evaluated on `Stop` (session exit). Captures a structured snapshot of changes,
# modified files, and handoff notes into `.agy/state/handoff.json` and `last_handoff.md`.
[stop]
# Set `enabled = false` to disable writing session handoffs.
enabled = true

# Records structured JSON and Markdown handoff summaries on session exit.
record_handoff = true

# Maximum number of modified files recorded in the handoff snapshot.
max_modified_files = 10


# ------------------------------------------------------------------------------
# 7. DECLARATIVE CUSTOM CHECKS (OPTIONAL SCAFFOLD)
# ------------------------------------------------------------------------------
# Custom shell assertions evaluated during `PreToolUse` without requiring
# Rust recompilation.
#
# Fields:
#   - name:                    Descriptive check identifier.
#   - matcher:                 Regex matching tool names that trigger this check.
#   - command:                 Array of command tokens executed on the host.
#   - fail_if_output_contains: Substring in command stdout/stderr that triggers failure.
#   - decision:                "deny" (block tool execution) or "ask" (prompt operator [y/n]).
#   - reason:                  Explanation message returned to the agent or operator.
#
# EXAMPLES (Uncomment to enable):
#
# [[pre_tool_use.custom_checks]]
# name = "disk_space_sentry"
# matcher = "modify_code|write_file"
# command = ["df", "--output=pcent", "."]
# fail_if_output_contains = "100%"
# decision = "deny"
# reason = "Disk space critical: filesystem write operations blocked."
#
# [[pre_tool_use.custom_checks]]
# name = "git_large_file_guard"
# matcher = "modify_code|write_file"
# command = ["sh", "-c", "find . -type f -size +10M -not -path './target/*' -not -path './.git/*'"]
# fail_if_output_contains = "."
# decision = "ask"
# reason = "Large file detected in workspace (>10MB). Require human confirmation before editing."
