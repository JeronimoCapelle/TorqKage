# tools.toml — Declarative MCP Tool Definitions & Guard Policies for agy-mcp

# ==============================================================================
# BASE TOOL TEMPLATES (Abstract engines inherited by concrete scoped tools)
# ==============================================================================

[base_tools.code_modifier]
description = "Applies Aider search/replace blocks or diffs via context-aware fuzzy mpatch"
action = "mpatch_edit"
category = "filesystem"
mutating = true
enforce_workspace_bounds = true
ban_dangerous_files = true

[base_tools.file_creator]
description = "Creates a new file strictly within the canonical workspace bounds"
action = "file_write"
category = "filesystem"
mutating = true
enforce_workspace_bounds = true
ban_dangerous_files = true

# ==============================================================================
# CONCRETE TOOLS (Declarative, Scoped, Inheriting from Base Templates)
# ==============================================================================

# --- Filesystem Inspection ---

[tools.read_project_file]
description = "Reads a file within the project root. Output is truncated safely."
action = "file_read"
category = "filesystem"
enforce_workspace_bounds = true
ban_dangerous_files = true
truncate_lines = 800
truncate_bytes = 46080
emit_truncation_notice = true

[tools.query_project_spec]
description = "Searches the in-repo docs/ directory for grep-ready specs, opcodes, and ABI definitions"
action = "file_search"
category = "filesystem"
enforce_dir = "docs"
enforce_workspace_bounds = true
ban_dangerous_files = true
truncate_lines = 150
timeout_seconds = 10

[tools.search_codebase]
description = "Searches the codebase for a text or regex pattern using ripgrep (bounded to project root)"
action = "parameterized_command"
category = "filesystem"
enforce_workspace_bounds = true
ban_dangerous_files = true
command = ["rg", "--max-count", "30", "--max-columns", "200", "--"]
args = [
    { name = "query", required = true, regex = "^[^\\x00-\\x1f]+$", description = "Text or regex search query to search across project files" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 15

# --- Tier 1: Unified Project Code Modification & Creation ---

[tools.modify_code]
inherit = "base_tools.code_modifier"
description = "Applies Aider search/replace blocks or diffs via context-aware fuzzy mpatch"

[tools.write_file]
inherit = "base_tools.file_creator"
description = "Creates a new file strictly within the canonical workspace bounds"

# ==============================================================================
# DECLARATIVE PER-AGENT PATH & DIRECTORY GUARDS
# ==============================================================================

[agent_guards.coder]
allowed_dirs = ["src"]
disallowed_dirs = ["tests", "benches"]

[agent_guards.test-author]
allowed_dirs = ["tests", "benches"]
disallowed_dirs = ["src"]

[agent_guards.planner]
allowed_dirs = ["docs", ".scratchpad"]
allowed_files = ["ARCHITECTURE.md"]
disallowed_dirs = ["src", "tests", "benches"]

[agent_guards.copilot]
allowed_dirs = ["*"]

[agent_guards.finisher]
allowed_dirs = ["*"]

# --- Compilation & Compiler Diagnostics ---

[tools.run_quick_check]
description = "Runs cargo check with zero token noise. Returns exit code only."
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "check", "--tests"]
output_capture = "exit_code_only"
timeout_seconds = 60

[tools.run_cargo_verification]
description = "Runs cargo check and returns filtered JSON error spans."
action = "cargo_json_diagnostics"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "check", "--message-format=json"]
output_capture = "json_spans"
attach_rustc_explain = true
timeout_seconds = 120

[tools.run_cargo_clippy]
description = "Runs cargo clippy across all targets with -D warnings, emitting filtered JSON diagnostics"
action = "cargo_json_diagnostics"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "clippy", "--all-targets", "--message-format=json", "--", "-D", "warnings"]
output_capture = "json_spans"
attach_rustc_explain = true
timeout_seconds = 120

[tools.run_cargo_clippy_fix]
description = "Runs cargo clippy --fix to automatically resolve compiler-suggested lint fixes (supervised gate)"
action = "static_command"
category = "compilation"
mutating = true
command = ["cargo", "clippy", "--fix", "--allow-dirty", "--allow-staged", "--all-targets", "--", "-D", "warnings"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180
require_permission_gate = true

# --- Architectural & High-Level Introspection Tooling ---

[tools.inspect_module_structure]
description = "Visualizes crate module tree and visibility boundaries (pub/crate). Defaults to clean module tree; can focus on specific modules or packages."
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "modules", "structure", "--no-fns", "--no-traits", "--no-types"]
args = [
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Specific workspace package to inspect (e.g. agy-mcp)" },
    { name = "focus_on", required = false, flag = "--focus-on", regex = "^[a-zA-Z0-9_:]+$", description = "Focus tree on a specific path, e.g. 'actions' or 'server'" },
    { name = "max_depth", required = false, flag = "--max-depth", regex = "^[0-9]+$", description = "Maximum tree depth" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 30

[tools.inspect_module_dependencies]
description = "Visualizes crate internal module dependency graph and coupling. Defaults to module-level dependency graph; can focus on specific modules or packages."
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "modules", "dependencies", "--no-fns", "--no-traits", "--no-types"]
args = [
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Specific workspace package to inspect (e.g. agy-mcp)" },
    { name = "focus_on", required = false, flag = "--focus-on", regex = "^[a-zA-Z0-9_:]+$", description = "Focus dependency graph on a specific module path" },
    { name = "max_depth", required = false, flag = "--max-depth", regex = "^[0-9]+$", description = "Maximum dependency graph depth" }
]
output_capture = "stdout"
truncate_lines = 200
timeout_seconds = 30

[tools.run_cargo_deny]
description = "Checks supply-chain security, RustSec advisories, banned crates, license allowlists, and sources via cargo-deny"
action = "static_command"
category = "release"
command = ["cargo", "deny", "check"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 60

[tools.run_cargo_machete]
description = "Scans Cargo.toml manifests for unused dependencies via cargo-machete"
action = "static_command"
category = "diagnostics"
command = ["cargo", "machete"]
output_capture = "stdout"
truncate_lines = 80
timeout_seconds = 45

[tools.run_cargo_public_api]
description = "Inspects and diffs the exposed public API surface of the crate against git revisions"
action = "static_command"
category = "release"
require_workspace_clean = true
command = ["cargo", "public-api", "diff"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 60

[tools.run_cargo_semver_checks]
description = "Verifies semantic versioning contract rules against the published API baseline"
action = "static_command"
category = "release"
require_workspace_clean = true
require_clippy_clean = true
require_tests_passed = true
command = ["cargo", "semver-checks", "check-release"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180

[tools.run_cargo_hack]
description = "Performs matrix verification checking all feature flag combinations (--each-feature)"
action = "static_command"
category = "compilation"
command = ["cargo", "hack", "check", "--each-feature"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180

[tools.run_cargo_outdated]
description = "Scans dependencies to find available SemVer updates and compatibility ranges"
action = "static_command"
category = "diagnostics"
command = ["cargo", "outdated", "--depth", "1"]
output_capture = "stdout"
truncate_lines = 60
timeout_seconds = 60

[tools.run_cargo_expand]
description = "Expands macros and visualizes generated compiler tokens for a specific item (struct, enum, fn, module) with token-smart fallback on error"
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "expand"]
args = [
    { name = "item_path", required = true, regex = "^[a-zA-Z0-9_:]+$", description = "Target item or module path to expand (e.g. 'Processor' or 'types::state')" }
]
error_fallback = "token_smart_not_found"
output_capture = "stdout"
truncate_lines = 250
timeout_seconds = 60

[tools.run_ast_grep]
description = "Performs structural AST pattern queries across source trees via ast-grep"
action = "static_command"
category = "diagnostics"
command = ["ast-grep", "scan"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 30

[tools.ast_grep_rewrite]
description = "Performs structural, AST-aware code search and batch rewrite across source files using ast-grep patterns"
action = "parameterized_command"
category = "filesystem"
mutating = true
require_permission_gate = true
command = ["ast-grep", "run", "--update-all"]
args = [
    { name = "pattern", required = true, flag = "-p", regex = "^[^\\x00]+$", description = "AST pattern to match (e.g. '$A.unwrap()')" },
    { name = "rewrite", required = true, flag = "-r", regex = "^[^\\x00]+$", description = "Replacement AST template (e.g. '$A?')" },
    { name = "lang", required = false, flag = "-l", regex = "^[a-zA-Z0-9]+$", description = "Target language (e.g. 'rust', 'toml', 'json', 'yaml')" },
    { name = "path", required = false, regex = "^[a-zA-Z0-9_./-]+$", description = "Target file or directory path (defaults to whole repository)" }
]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 30

[tools.query_rustc_explain]
description = "Retrieves the official rustc compiler explanation, error diagnostics, and erroneous/fixed code examples for a specific Rust error code (e.g. E0308)"
action = "parameterized_command"
category = "diagnostics"
command = ["rustc", "--explain"]
args = [
    { name = "error_code", required = true, regex = "^E[0-9]{4}$", description = "Standard rustc error code (e.g. 'E0308', 'E0382', 'E0502')" }
]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 10

# --- Test Suite & Verification Tooling ---

[tools.run_cargo_test]
description = "Executes unit and integration tests via standard cargo test with optional target/filter overrides"
action = "parameterized_command"
category = "testing"
tracks_circuit_breaker = true
command = ["cargo", "test"]
args = [
    { name = "test_target", required = false, regex = "^[a-zA-Z0-9_-]+$", flag = "--test", description = "Optional test binary name (e.g. 'concurrency_test', 'property_test')" },
    { name = "filter", required = false, regex = "^[a-zA-Z0-9_:]+$", description = "Optional test name filter" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 180

[tools.run_cargo_nextest]
description = "Executes unit and integration tests in parallel via nextest with optional target/filter overrides"
action = "parameterized_command"
category = "testing"
tracks_circuit_breaker = true
command = ["cargo", "nextest", "run"]
args = [
    { name = "test_target", required = false, regex = "^[a-zA-Z0-9_-]+$", flag = "--test", description = "Optional integration test target" },
    { name = "filter", required = false, regex = "^[a-zA-Z0-9_:]+$", description = "Optional test name filter" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 120

[tools.run_coverage_summary]
description = "Extracts line and branch coverage summary via cargo llvm-cov"
action = "static_command"
category = "testing"
require_tests_passed = true
command = ["cargo", "llvm-cov", "--summary-only"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180

[tools.run_mutation_tests]
description = "Executes cargo-mutants to verify test assertions catch subtle injected bugs"
action = "static_command"
category = "testing"
require_tests_passed = true
command = ["cargo", "mutants", "--no-shuffle"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 300

[tools.run_cargo_insta]
description = "Executes snapshot tests for golden ASTs, opcode decoders, and struct serialization"
action = "static_command"
category = "testing"
tracks_circuit_breaker = true
command = ["cargo", "insta", "test", "--accept"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 120

[tools.run_cargo_fuzz]
description = "Executes libFuzzer target to discover crashes, panics, and out-of-bounds byte accesses"
action = "static_command"
category = "testing"
command = ["cargo", "fuzz", "run", "--", "-max_total_time=60"]
output_capture = "stderr"
truncate_lines = 100
timeout_seconds = 90

# --- Performance Profiling & Hardware Diagnostics Tooling ---

[tools.run_cargo_asm]
description = "Disassembles functions to inspect generated assembly, auto-vectorization, and spills"
action = "static_command"
category = "profiling"
command = ["cargo", "asm"]
output_capture = "stdout"
truncate_lines = 250
timeout_seconds = 60

[tools.run_cargo_bench]
description = "Executes benchmark suites across Divan, Criterion2, and Gungraun with optional target/filter overrides"
action = "parameterized_command"
category = "profiling"
require_tests_passed = true
command = ["cargo", "bench"]
args = [
    { name = "bench_target", required = false, regex = "^[a-zA-Z0-9_-]+$", flag = "--bench", description = "Specific benchmark target ('benchmark', 'criterion_bench', 'gungraun_bench')" },
    { name = "filter", required = false, regex = "^[a-zA-Z0-9_:]+$", description = "Optional benchmark name filter" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 240

[tools.run_cargo_careful]
description = "Executes tests with extra debug checks to detect undefined behavior and invalid operations"
action = "static_command"
category = "testing"
tracks_circuit_breaker = true
command = ["cargo", "careful", "test"]
output_capture = "stderr"
truncate_lines = 150
timeout_seconds = 180

[tools.run_cargo_miri]
description = "Runs tests inside Miri interpreter to verify strict pointer provenance and Tree Borrows"
action = "static_command"
category = "testing"
tracks_circuit_breaker = true
command = ["cargo", "miri", "test"]
output_capture = "stderr"
truncate_lines = 200
timeout_seconds = 300

[tools.run_flamegraph]
description = "Generates CPU flame graphs to identify profiling hotspots and callstack bottlenecks"
action = "static_command"
category = "profiling"
require_tests_passed = true
command = ["cargo", "flamegraph", "--root", "--deterministic"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 240

[tools.run_cargo_perf]
description = "Collects hardware performance counters (cache misses, branch mispredictions, cycle count) during test execution via Linux perf"
action = "static_command"
category = "profiling"
require_tests_passed = true
command = ["perf", "stat", "-B", "cargo", "test"]
output_capture = "stderr"
truncate_lines = 50
timeout_seconds = 180

[tools.run_cargo_bloat]
description = "Analyzes binary size per symbol and crate to pinpoint monomorphization bloat"
action = "static_command"
category = "profiling"
command = ["cargo", "bloat", "--release", "-n", "30"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 60

[tools.run_hyperfine]
description = "Executes black-box binary benchmarking via hyperfine with statistical timing and warmup"
action = "static_command"
category = "profiling"
require_tests_passed = true
command = ["hyperfine", "--warmup", "3"]
output_capture = "stdout"
truncate_lines = 40
timeout_seconds = 120

[tools.analyze_llvm_mca]
description = "Pipes generated assembly into llvm-mca to simulate CPU instruction ports, latency, and register pressure"
action = "static_command"
category = "profiling"
command = ["llvm-mca", "-march=x86-64", "-mcpu=native"]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 30

