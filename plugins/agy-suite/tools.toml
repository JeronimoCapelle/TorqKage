# ==============================================================================
# tools.toml — Declarative MCP Tool Definitions & Guard Policies for agy-mcp
# ==============================================================================
#
# PURPOSE & ARCHITECTURAL ROLE:
# ------------------------------
# `tools.toml` defines all Model Context Protocol (MCP) tools exposed to LLM
# agents by the `agy-mcp` server. It acts as a declarative tool engine that
# dynamically synthesizes JSON Schemas, validates parameters against regex
# constraints, enforces path confinement, monitors safety policies, and
# executes actions without requiring hardcoded Rust logic.
#
# DECLARATIVE TOOL SCHEMA SPECIFICATION:
# --------------------------------------
# Each tool declared in `[tools.<name>]` or `[base_tools.<name>]` supports:
#
# 1. INHERITANCE:
#    - `inherit`: String referencing a template in `[base_tools.<name>]`.
#      The child tool inherits all base properties and selectively overrides fields.
#
# 2. ACTIONS (`action`):
#    The execution engine powering the tool:
#    - `file_read`: Bounded file reading with line/byte truncation and truncation notices.
#    - `file_write`: Atomic file creation strictly within workspace bounds.
#    - `mpatch_edit`: Fuzzy search/replace block patcher (powered by mpatch engine).
#    - `file_search`: Scoped grep/ripgrep search across configured documentation paths.
#    - `static_command`: Runs a fixed shell/CLI command without dynamic arguments.
#    - `parameterized_command`: Runs CLI commands with validated, regex-checked parameters.
#    - `cli_manual`: Renders man-page style help text for available commands.
#    - `project_state`: Synthesizes VCS revision, status, branch, and quality gate health.
#    - `workspace_ensure`: Provisions or validates an isolated Jujutsu sparse workspace.
#    - `workspace_inspect`: Inspects the active state and commit ID of an isolated workspace.
#    - `workspace_merge`: Merges changes from an agent's isolated workspace back into trunk.
#
# 3. SAFETY & POLICY FLAGS:
#    - `category`: Logical tool category (e.g. "filesystem", "compilation", "diagnostics",
#                  "vcs", "release", "documentation", "system").
#    - `mutating`: Boolean indicating if the tool modifies the filesystem or working tree.
#                  Monitored by `manifest_guard` and `circuit_breaker` in `agy-hooks`.
#    - `tracks_circuit_breaker`: Nonzero exit codes count as compiler failure strikes.
#    - `require_permission_gate`: Prompts operator for [y/n] confirmation prior to execution.
#
# 4. SANDBOXING & FILE BOUNDARIES:
#    - `enforce_workspace_bounds`: Blocks path traversal (`../`) and out-of-tree symlinks.
#    - `ban_dangerous_files`: Blocks reading/writing credentials, keys, VCS internals,
#                             and sensitive shell profiles.
#    - `allowed_directories`: Restricts this specific tool to operate only in listed paths.
#
# 5. ARGUMENT SPECIFICATION (`args`):
#    - `name`: Parameter name in the MCP JSON Schema.
#    - `description`: Explanatory text for the LLM.
#    - `required`: Boolean indicating if the argument is mandatory.
#    - `regex`: Strict regex validation pattern to prevent shell injection.
#    - `flag`: CLI flag to prepend when passing the argument (e.g. "-p", "--bin").
#    - `default`: Default value if omitted by the caller.
#
# 6. OUTPUT CAPTURE & TRUNCATION:
#    - `output_capture`: Process streams captured:
#      * "stdout": Capture stdout only.
#      * "stderr": Capture stderr only.
#      * "both": Capture combined stdout and stderr.
#      * "exit_code_only": Returns "Success (exit code 0)" with zero token output.
#      * "json_spans": Filters compiler JSON stream to meaningful error spans.
#    - `truncate_lines`: Max lines returned before truncation.
#    - `truncate_bytes`: Max bytes returned before truncation.
#    - `emit_truncation_notice`: Appends a notice when output has been truncated.
#    - `timeout_seconds`: Process execution timeout before aborting.
#
# 7. PRECONDITIONS:
#    - `require_gates`: Array of gate names that must succeed before tool execution.
#      Supports native gates (`"workspace_clean"`, `"vcs_conflicts"`), standard project
#      gates (`"compilation"`, `"linter"`, `"tests"`), or any custom gate in `project.toml`.
#    - `skip_gates`: Array of gate names to exempt from category inheritance (or `["*"]`).
#
# 8. FALLBACKS & EXIT CODES:
#    - `empty_fallback`: Text returned if command produces empty output.
#    - `error_fallback`: Text returned if command fails.
#    - `success_exit_codes`: Array of integer exit codes treated as success (e.g. [0, 1]).
#
# ==============================================================================

# ==============================================================================
# CATEGORY DEFAULTS (Shared defaults applied to all tools declaring a category)
# ==============================================================================
# The Category System provides multi-tier declarative inheritance:
#   [categories.<name>]  -->  [base_tools.<name>]  -->  [tools.<name>]
#
# Rules:
#   1. Tools declaring `category = "<name>"` inherit all category attributes
#      (e.g. `tracks_circuit_breaker`, `require_gates`, `timeout_seconds`).
#   2. Gate Accumulation & Selective Opt-Out:
#      - Category `require_gates` are automatically inherited by all member tools.
#      - Concrete tools can add extra gates: `require_gates = ["extra_gate"]`.
#      - Concrete tools can selectively opt out: `skip_gates = ["vcs_conflicts"]`.
#      - Concrete tools can bypass all gates: `skip_gates = ["*"]` or `["all"]`.
#   3. Attribute Precedence:
#      - Concrete tool > Base tool template > Category defaults.

[categories.compilation]
category = "compilation"
tracks_circuit_breaker = true
require_gates = ["vcs_conflicts"]
timeout_seconds = 120

[categories.testing]
category = "testing"
tracks_circuit_breaker = true
require_gates = ["vcs_conflicts"]
timeout_seconds = 180

[categories.release]
category = "release"
tracks_circuit_breaker = true
require_gates = ["workspace_clean", "vcs_conflicts", "linter", "tests"]
timeout_seconds = 300

[categories.filesystem]
category = "filesystem"
enforce_workspace_bounds = true
ban_dangerous_files = true
timeout_seconds = 15

[categories.diagnostics]
category = "diagnostics"
timeout_seconds = 30

[categories.documentation]
category = "documentation"
enforce_workspace_bounds = true
ban_dangerous_files = true
timeout_seconds = 15

[categories.profiling]
category = "profiling"
timeout_seconds = 180


# ==============================================================================
# BASE TOOL TEMPLATES (Abstract engines inherited by concrete scoped tools)
# ==============================================================================

[base_tools.code_modifier]
description = "Applies Aider search/replace blocks or diffs via context-aware fuzzy mpatch"
action = "mpatch_edit"
category = "filesystem"
mutating = true
enforce_workspace_bounds = true
ban_dangerous_files = true

[base_tools.file_creator]
description = "Creates a new file strictly within the canonical workspace bounds"
action = "file_write"
category = "filesystem"
mutating = true
enforce_workspace_bounds = true
ban_dangerous_files = true

[base_tools.cargo_base]
description = "Base execution template for cargo commands with compiler circuit breaker tracking"
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
timeout_seconds = 60

[base_tools.perf_tool]
description = "Base execution template for performance profiling and microbenchmarks"
action = "static_command"
category = "profiling"
timeout_seconds = 60

# ==============================================================================
# CONCRETE TOOLS (Declarative, Scoped, Inheriting from Base Templates)
# ==============================================================================

# --- Filesystem Inspection & Exploration ---

[tools.read_project_file]
description = "Reads a file within the project root. Output is truncated safely."
action = "file_read"
category = "filesystem"
enforce_workspace_bounds = true
ban_dangerous_files = true
truncate_lines = 800
truncate_bytes = 46080
emit_truncation_notice = true

[tools.list_directory]
description = "Lists files and directory contents with file permissions, byte sizes, and timestamps using ls"
action = "parameterized_command"
category = "filesystem"
command = ["ls", "-la", "--group-directories-first"]
args = [
    { name = "path", required = false, default = ".", regex = "^[a-zA-Z0-9_./-]+$", description = "Directory path to list (defaults to project root '.')" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 10

[tools.inspect_directory_tree]
description = "Visualizes recursive directory tree hierarchy up to a specified depth using eza"
action = "parameterized_command"
category = "filesystem"
command = ["eza", "--tree", "--icons=never", "--ignore-glob", ".git|.jj|.agy|target"]
args = [
    { name = "level", required = false, default = "2", flag = "-L", regex = "^[1-5]$", description = "Max recursion tree depth (1 to 5, defaults to 2)" },
    { name = "path", required = false, default = ".", regex = "^[a-zA-Z0-9_./-]+$", description = "Root path to display tree from (defaults to '.')" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 10

[tools.find_project_files]
description = "Finds project files matching a name or regex pattern across the workspace using fd (skips VCS internals by default)"
action = "parameterized_command"
category = "filesystem"
command = ["fd", "--glob", "--hidden", "--exclude", ".git", "--exclude", ".jj", "--exclude", ".agy", "--exclude", "target"]
args = [
    { name = "pattern", required = true, regex = "^[^\\x00-\\x1f]+$", description = "File name pattern or extension (e.g. '*.toml', 'state', 'test_')" },
    { name = "path", required = false, default = ".", regex = "^[a-zA-Z0-9_./-]+$", description = "Root path to search from (defaults to '.')" }
]
empty_fallback = "No files found matching pattern."
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 15

[tools.inspect_file_meta]
description = "Inspects file stat and metadata (exact byte size, permissions, inode, access/modify timestamps) without reading file content"
action = "parameterized_command"
category = "filesystem"
command = ["stat"]
args = [
    { name = "path", required = true, regex = "^[a-zA-Z0-9_./-]+$", description = "Target file or directory path relative to workspace" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.inspect_file_type]
description = "Determines the file MIME type, encoding, and format (e.g. text/plain, ELF binary, UTF-8) using file"
action = "parameterized_command"
category = "filesystem"
command = ["file", "-b"]
args = [
    { name = "path", required = true, regex = "^[a-zA-Z0-9_./-]+$", description = "Target file path relative to workspace" }
]
output_capture = "stdout"
truncate_lines = 20
timeout_seconds = 10

[tools.count_file_lines]
description = "Counts total lines in a file or directory using wc -l (recursively scanning directories while skipping hidden and build cache files)"
action = "parameterized_command"
category = "filesystem"
command = ["bash", "-c", "if [ -d \"$1\" ]; then find \"$1\" -type f -not -path '*/.*' -not -path '*/target/*' -exec wc -l {} +; else wc -l \"$1\"; fi", "--"]
args = [
    { name = "path", required = true, regex = "^[a-zA-Z0-9_./-]+$", description = "Target file or directory path relative to workspace (e.g. 'src/lib.rs', 'src')" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.query_project_spec]
description = "Searches project documentation and specifications across configured doc paths (docs/, ARCHITECTURE.md, etc.) for grep-ready specs, opcodes, and ABI definitions"
action = "file_search"
category = "documentation"
enforce_workspace_bounds = true
ban_dangerous_files = true
truncate_lines = 150
timeout_seconds = 10
args = [
    { name = "pattern", required = true, regex = "^[^\\x00-\\x1f]+$", description = "Text or regular expression to search across documentation" },
    { name = "path", required = false, regex = "^[a-zA-Z0-9_./-]+$", description = "Specific documentation directory or file to search (defaults to all configured doc paths)" },
    { name = "is_regex", required = false, description = "Whether to evaluate pattern as a regular expression (defaults to true if pattern is valid regex)" },
    { name = "case_sensitive", required = false, description = "Whether search is case-sensitive (defaults to false)" }
]

[tools.list_project_docs]
description = "Lists all documentation files, specifications, and architecture blueprints in the project (docs/, specs/, ARCHITECTURE.md)"
action = "parameterized_command"
category = "documentation"
command = ["fd", "--extension", "md", "--extension", "markdown"]
args = [
    { name = "path", required = false, default = ".", regex = "^[a-zA-Z0-9_./-]+$", description = "Directory to list docs from (defaults to project root '.')" }
]
empty_fallback = "No documentation files found."
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 10

[tools.search_codebase]
description = "Searches the codebase for a text or regex pattern using ripgrep (bounded to project root)"
action = "parameterized_command"
category = "filesystem"
enforce_workspace_bounds = true
ban_dangerous_files = true
command = ["rg", "--max-count", "30", "--max-columns", "200"]
args = [
    { name = "fixed_strings", required = false, flag = "-F", switch = true, description = "Treat the query as a literal string rather than a regular expression" },
    { name = "query", required = true, regex = "^[^\\x00-\\x1f]+$", description = "Text or regex search query to search across project files" },
    { name = "path", required = false, default = ".", regex = "^[a-zA-Z0-9_./-]+$", description = "Directory or file to search (defaults to project root)" }
]
empty_fallback = "No occurrences found in codebase for the specified search query."
success_exit_codes = [0, 1]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 15

# --- Tier 1: Unified Project Code Modification & Creation ---

[tools.modify_code]
inherit = "base_tools.code_modifier"
description = "Applies Aider search/replace blocks or diffs via context-aware fuzzy mpatch"

[tools.write_file]
inherit = "base_tools.file_creator"
description = "Creates a new file strictly within the canonical workspace bounds"

# ==============================================================================
# PER-AGENT PATH & DIRECTORY GUARDS
# ==============================================================================
# In agy-suite, per-agent file modification boundaries (`allowed_dirs`,
# `disallowed_dirs`, `allowed_files`, `disallowed_files`) are defined directly
# within the YAML frontmatter of each agent's manifest (`plugins/agy-suite/agents/*.md`).
# `agy-mcp` automatically discovers and enforces these agent-level perimeters.


# --- Compilation & Compiler Diagnostics ---

[tools.quick_check]
description = "Runs cargo fast check with zero token noise (exit code only) for maximum incremental iteration speed"
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "fast", "check", "--tests"]
output_capture = "exit_code_only"
timeout_seconds = 60

[tools.cargo_check]
description = "Runs cargo fast check and returns concise compiler diagnostics"
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "fast", "check", "--message-format=short", "--color=never"]
output_capture = "both"
empty_fallback = "Verification passed: 0 errors, 0 warnings."
truncate_lines = 120
timeout_seconds = 120

[tools.cargo_clippy]
description = "Runs cargo fast clippy across all targets with -D warnings, emitting concise diagnostics"
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "fast", "clippy", "--all-targets", "--message-format=short", "--color=never", "--", "-D", "warnings"]
output_capture = "both"
empty_fallback = "Verification passed: 0 errors, 0 warnings."
truncate_lines = 120
timeout_seconds = 120

[tools.cargo_clippy_fix]
description = "Runs cargo fast clippy --fix to automatically resolve compiler-suggested lint fixes (supervised gate)"
action = "static_command"
category = "compilation"
mutating = true
command = ["cargo", "fast", "clippy", "--fix", "--allow-dirty", "--allow-staged", "--all-targets", "--", "-D", "warnings"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180
require_permission_gate = true

[tools.cargo_build]
description = "Compiles packages and binaries using cargo fast build (Cranelift + Mold + O0 deps) for high-speed compilation"
action = "parameterized_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "fast", "build"]
args = [
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Specific package to build (defaults to workspace)" },
    { name = "bin", required = false, flag = "--bin", regex = "^[a-zA-Z0-9_-]+$", description = "Specific binary to build" },
    { name = "all_targets", required = false, flag = "--all-targets", regex = "^true$", description = "Build all binaries, tests, benches, and examples" }
]
output_capture = "both"
truncate_lines = 100
timeout_seconds = 180

[tools.cargo_run]
description = "Compiles and executes a specific workspace binary via cargo fast run"
action = "parameterized_command"
category = "compilation"
command = ["cargo", "fast", "run"]
args = [
    { name = "bin", required = false, flag = "--bin", regex = "^[a-zA-Z0-9_-]+$", description = "Specific binary name to execute" },
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Specific package containing the binary" }
]
output_capture = "both"
truncate_lines = 100
timeout_seconds = 60

# --- Architectural & High-Level Introspection Tooling ---

[tools.inspect_module_structure]
description = "Visualizes crate module tree and visibility boundaries (pub/crate). Defaults to clean module tree; can focus on specific modules or packages."
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "modules", "structure", "--no-fns", "--no-traits", "--no-types"]
args = [
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Specific workspace package to inspect (e.g. agy-mcp)" },
    { name = "bin", required = false, flag = "--bin", regex = "^[a-zA-Z0-9_-]+$", description = "Disambiguate binary target for hybrid crates (e.g. 'pureV')" },
    { name = "lib", required = false, flag = "--lib", switch = true, description = "Disambiguate library target for hybrid crates" },
    { name = "focus_on", required = false, flag = "--focus-on", regex = "^[a-zA-Z0-9_:]+$", description = "Focus tree on a specific path, e.g. 'actions' or 'server'" },
    { name = "max_depth", required = false, flag = "--max-depth", regex = "^[0-9]+$", description = "Maximum tree depth" }
]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 30

[tools.inspect_module_dependencies]
description = "Visualizes crate internal module dependency graph and coupling. Defaults to module-level dependency graph; can focus on specific modules or packages."
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "modules", "dependencies", "--no-fns", "--no-traits", "--no-types"]
args = [
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Specific workspace package to inspect (e.g. agy-mcp)" },
    { name = "bin", required = false, flag = "--bin", regex = "^[a-zA-Z0-9_-]+$", description = "Disambiguate binary target for hybrid crates (e.g. 'pureV')" },
    { name = "lib", required = false, flag = "--lib", switch = true, description = "Disambiguate library target for hybrid crates" },
    { name = "focus_on", required = false, flag = "--focus-on", regex = "^[a-zA-Z0-9_:]+$", description = "Focus dependency graph on a specific module path" },
    { name = "max_depth", required = false, flag = "--max-depth", regex = "^[0-9]+$", description = "Maximum dependency graph depth" }
]
output_capture = "both"
truncate_lines = 200
timeout_seconds = 30

[tools.cargo_deny]
description = "Checks supply-chain security, RustSec advisories, banned crates, license allowlists, and sources via cargo-deny"
action = "static_command"
category = "release"
command = ["cargo", "deny", "check"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 60

[tools.cargo_machete]
description = "Scans Cargo.toml manifests for unused dependencies via cargo-machete"
action = "static_command"
category = "diagnostics"
command = ["cargo", "machete"]
output_capture = "stdout"
truncate_lines = 80
timeout_seconds = 45

[tools.cargo_public_api]
description = "Inspects and diffs the exposed public API surface of the crate against git revisions"
action = "static_command"
category = "release"
command = ["cargo", "public-api", "diff"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 60

[tools.query_public_api]
description = "Extracts compiler-verified public API signatures of a workspace crate or installed package via cargo-public-api"
action = "parameterized_command"
category = "diagnostics"
command = ["cargo-public-api", "-s", "-s", "-v"]
args = [
    { name = "package", required = false, flag = "-p", regex = "^[a-zA-Z0-9_-]+$", description = "Name of the package or dependency to inspect (e.g. 'ratatui', 'serde', 'agy-common', defaults to current root crate)" }
]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 30

[tools.cargo_semver_checks]
description = "Verifies semantic versioning contract rules against the published API baseline"
action = "static_command"
category = "release"
command = ["cargo", "semver-checks", "check-release"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180

[tools.cargo_hack]
description = "Performs matrix verification checking all feature flag combinations (--each-feature)"
action = "static_command"
category = "compilation"
command = ["cargo", "hack", "check", "--each-feature"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 180

[tools.cargo_outdated]
description = "Scans dependencies to find available SemVer updates and compatibility ranges"
action = "static_command"
category = "diagnostics"
command = ["cargo", "outdated", "--depth", "1"]
output_capture = "stdout"
truncate_lines = 60
timeout_seconds = 60

[tools.cargo_expand]
description = "Expands macros and visualizes generated compiler tokens for a specific item (struct, enum, fn, module) with token-smart fallback on error"
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "expand"]
args = [
    { name = "item_path", required = true, regex = "^[a-zA-Z0-9_:]+$", description = "Target item or module path to expand (e.g. 'Processor' or 'types::state')" }
]
error_fallback = "token_smart_not_found"
output_capture = "stdout"
truncate_lines = 250
timeout_seconds = 60

[tools.ast_grep]
description = "Performs structural AST pattern queries across source trees via ast-grep"
action = "static_command"
category = "diagnostics"
command = ["ast-grep", "scan"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 30

[tools.ast_grep_rewrite]
description = "Performs structural, AST-aware code search and batch rewrite across source files using ast-grep patterns"
action = "parameterized_command"
category = "filesystem"
mutating = true
require_permission_gate = true
command = ["ast-grep", "run", "--update-all"]
args = [
    { name = "pattern", required = true, flag = "-p", regex = "^[^\\x00]+$", description = "AST pattern to match (e.g. '$A.unwrap()')" },
    { name = "rewrite", required = true, flag = "-r", regex = "^[^\\x00]+$", description = "Replacement AST template (e.g. '$A?')" },
    { name = "lang", required = false, flag = "-l", regex = "^[a-zA-Z0-9]+$", description = "Target language (e.g. 'rust', 'toml', 'json', 'yaml')" },
    { name = "path", required = false, regex = "^[a-zA-Z0-9_./-]+$", description = "Target file or directory path (defaults to whole repository)" }
]
empty_fallback = "No matching AST patterns found to rewrite."
success_exit_codes = [0, 1]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 30

[tools.query_code_graph]
description = "Queries the Tree-sitter code graph for cross-file callers, callees, symbols, and blast-radius impact analysis across Rust, Python, Go, and JS/TS"
action = "parameterized_command"
category = "diagnostics"
command = ["graphtrail", "--db", ".agy/cache/graphtrail.db"]
args = [
    { name = "action", required = true, regex = "^(callers|callees|impact|search|context|affected|dead-code)$", description = "Query action to execute (callers, callees, impact, search, context, affected, dead-code)" },
    { name = "target", required = false, regex = "^[^\\x00\\r\\n]+$", description = "Symbol name or relative file path to analyze" }
]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 20

[tools.sync_code_graph]
description = "Indexes or refreshes the Tree-sitter code graph database (.agy/cache/graphtrail.db) across the repository"
action = "static_command"
category = "diagnostics"
command = ["graphtrail", "sync", ".", "--db", ".agy/cache/graphtrail.db"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 30

[tools.query_compiler_explain]
description = "Retrieves compiler diagnostic explanations, error rationale, and code examples for a compiler error code (e.g. E0308)"
action = "parameterized_command"
category = "diagnostics"
command = ["rustc", "--explain"]
args = [
    { name = "error_code", required = true, regex = "^[A-Za-z0-9_-]+$", description = "Standard compiler error code (e.g. 'E0308', 'E0382')" }
]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 10

# --- Test Suite & Formal Verification Tooling ---

[tools.cargo_test]
description = "Executes unit and integration tests via cargo fast test with optional target/filter overrides"
action = "parameterized_command"
category = "testing"
tracks_circuit_breaker = true
command = ["cargo", "fast", "test"]
args = [
    { name = "test_target", required = false, regex = "^[a-zA-Z0-9_-]+$", flag = "--test", description = "Optional test binary name (e.g. 'concurrency_test', 'property_test')" },
