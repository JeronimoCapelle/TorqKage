# --- Performance Profiling & Hardware Diagnostics Tooling ---

[tools.cargo_asm]
description = "Disassembles functions to inspect generated assembly, auto-vectorization, and spills"
action = "static_command"
category = "profiling"
command = ["cargo", "asm"]
output_capture = "stdout"
truncate_lines = 250
timeout_seconds = 60

[tools.cargo_bench]
description = "Executes benchmark suites across Divan, Criterion2, and Gungraun with optional target/filter overrides"
action = "parameterized_command"
category = "profiling"
require_gates = ["tests"]
command = ["cargo", "bench"]
args = [
    { name = "bench_target", required = false, regex = "^[a-zA-Z0-9_-]+$", flag = "--bench", description = "Specific benchmark target ('benchmark', 'criterion_bench', 'gungraun_bench')" },
    { name = "filter", required = false, regex = "^[a-zA-Z0-9_:]+$", description = "Optional benchmark name filter" }
]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 240

[tools.flamegraph]
description = "Generates CPU flame graphs to identify profiling hotspots and callstack bottlenecks"
action = "static_command"
category = "profiling"
require_gates = ["tests"]
command = ["cargo", "flamegraph", "--root", "--deterministic"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 240

[tools.cargo_perf]
description = "Collects hardware performance counters (cache misses, branch mispredictions, cycle count) during test execution via Linux perf"
action = "static_command"
category = "profiling"
require_gates = ["tests"]
command = ["perf", "stat", "-B", "cargo", "test"]
output_capture = "stderr"
truncate_lines = 50
timeout_seconds = 180

[tools.cargo_bloat]
description = "Analyzes binary size per symbol and crate to pinpoint monomorphization bloat"
action = "static_command"
category = "profiling"
command = ["cargo", "bloat", "--release", "-n", "30"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 60

[tools.hyperfine]
description = "Executes black-box binary benchmarking via hyperfine with statistical timing and warmup"
action = "static_command"
category = "profiling"
require_gates = ["tests"]
command = ["hyperfine", "--warmup", "3"]
output_capture = "stdout"
truncate_lines = 40
timeout_seconds = 120

[tools.llvm_mca]
description = "Pipes generated assembly into llvm-mca to simulate CPU instruction ports, latency, and register pressure"
action = "static_command"
category = "profiling"
command = ["llvm-mca", "-march=x86-64", "-mcpu=native"]
output_capture = "stdout"
truncate_lines = 150
timeout_seconds = 30

[tools.llvm_objdump]
description = "Disassembles raw binary or object file using llvm-objdump with instruction decoding (useful for differential testing)"
action = "parameterized_command"
category = "diagnostics"
command = ["llvm-objdump", "-d"]
args = [
    { name = "file", required = true, regex = "^[a-zA-Z0-9_./-]+$", description = "Target binary, ELF, or object file to disassemble" },
    { name = "arch", required = false, flag = "--arch-name", regex = "^[a-zA-Z0-9_]+$", description = "Target architecture (e.g. 'riscv64', 'riscv32', 'x86_64')" }
]
output_capture = "stdout"
truncate_lines = 200
timeout_seconds = 15

[tools.cargo_size]
description = "Inspects binary section memory sizes (.text, .data, .bss, total) via cargo size (cargo-binutils)"
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "size"]
args = [
    { name = "bin", required = false, flag = "--bin", regex = "^[a-zA-Z0-9_-]+$", description = "Target binary name" }
]
output_capture = "stdout"
truncate_lines = 60
timeout_seconds = 30

[tools.cargo_nm]
description = "Lists symbol table and memory addresses of compiled ELF binaries via cargo nm (cargo-binutils)"
action = "parameterized_command"
category = "diagnostics"
command = ["cargo", "nm"]
args = [
    { name = "bin", required = false, flag = "--bin", regex = "^[a-zA-Z0-9_-]+$", description = "Target binary name" }
]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 30

