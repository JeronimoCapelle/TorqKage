# --- Release Automation & High-Level Mathematics Tooling ---

[tools.git_cliff]
description = "Generates structured Markdown changelog from Conventional Commits using git-cliff"
action = "static_command"
category = "release"
skip_gates = ["workspace_clean"]
command = ["git-cliff", "--unreleased", "--strip", "header"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 30

[tools.eval_symbolic_math]
description = "Executes exact symbolic mathematics (ODEs, Jacobians, Taylor series, simplifications) via SymPy inside an isolated, network-less Bubblewrap jail"
action = "parameterized_command"
category = "other"
enforce_sandbox = true
command = ["python3", "-c"]
args = [
    { name = "code", required = true, regex = "^[^\\x00]+$", description = "Python expression or multi-line snippet importing sympy to evaluate" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.query_tool_help]
description = "Retrieves live documentation, usage examples, and schemas for host CLI binaries ($PATH) or agy-suite MCP tools"
action = "cli_manual"
category = "diagnostics"
sanitize_input = "^[a-zA-Z0-9_-]+$"
truncate_lines = 100
timeout_seconds = 10

[tools.inspect_project_state]
description = "Inspects repository state: active branch, uncommitted changes, and recent handoff notes"
action = "project_state"
category = "diagnostics"
truncate_lines = 50
timeout_seconds = 10

[tools.inspect_circuit_breaker]
description = "Inspects the active circuit breaker ledger status, consecutive failure count, strike threshold, and last recorded error signature"
action = "static_command"
category = "diagnostics"
command = ["agy-ctrl", "inspect-breaker"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.reset_circuit_breaker]
description = "Resets the deterministic compiler circuit breaker consecutive failure counter and clears the tripped gate"
action = "static_command"
category = "diagnostics"
command = ["agy-ctrl", "reset-breaker"]
output_capture = "stdout"
truncate_lines = 20
timeout_seconds = 10

[tools.inspect_workspace_diff]
description = "Inspects the active working tree diff (jj diff or git diff) with automatic line truncation"
action = "static_command"
category = "diagnostics"
command = ["jj", "diff", "--color=never"]
empty_fallback = "Clean (no working copy changes detected)"
output_capture = "stdout"
truncate_lines = 200
timeout_seconds = 10

[tools.inspect_parent_commit]
description = "Inspects the parent commit (@-) metadata, commit message, and full diff in Jujutsu"
action = "static_command"
category = "diagnostics"
command = ["jj", "show", "@-", "--color=never"]
output_capture = "stdout"
truncate_lines = 250
timeout_seconds = 10

[tools.inspect_revision_log]
description = "Displays the recent Jujutsu revision history and change graph with change IDs and descriptions"
action = "static_command"
category = "diagnostics"
command = ["jj", "log", "-n", "10", "--no-graph", "--color=never"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 10

[tools.inspect_workspace_conflicts]
description = "Checks if any commits or files in the Jujutsu repository contain unresolved merge/rebase conflicts"
action = "static_command"
category = "diagnostics"
command = ["jj", "log", "-r", "conflicts()", "--no-graph", "--color=never"]
empty_fallback = "Clean (0 merge/rebase conflicts detected)"
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.inspect_bookmarks]
description = "Lists Jujutsu bookmarks (git branches) and their remote tracking status"
action = "static_command"
category = "diagnostics"
command = ["jj", "bookmark", "list", "--color=never"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.jj_absorb_working_copy]
description = "Auto-distributes working copy edits into their closest ancestor commits via Jujutsu absorb"
action = "static_command"
category = "diagnostics"
mutating = true
command = ["jj", "absorb", "--color=never"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.jj_describe_revision]
description = "Sets or updates the commit description message for a Jujutsu revision (defaults to active working copy @)"
action = "parameterized_command"
category = "diagnostics"
mutating = true
command = ["jj", "describe", "--color=never"]
args = [
    { name = "message", required = true, flag = "-m", regex = "^[^\\x00]+$", description = "Commit description message (e.g. 'feat(mcp): add module dependency inspection')" },
    { name = "revision", required = false, flag = "-r", regex = "^[a-zA-Z0-9_@~^.:-]+$", description = "Target revision to describe (defaults to '@')" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.ensure_agent_workspace]
description = "Ensures an isolated Jujutsu workspace exists for a subagent (.agy/workspaces/<agent>), automatically rebasing clean workspaces onto default@ and symlinking the shared build target cache"
action = "workspace_ensure"
category = "diagnostics"
args = [
    { name = "agent", required = true, regex = "^[a-zA-Z0-9_-]+$", description = "Subagent name (e.g. 'coder', 'test-author', 'mini', 'perf-analyst')" }
]
truncate_lines = 50
timeout_seconds = 15

[tools.inspect_agent_workspace]
description = "Inspects revisions and working-copy diffs within a subagent's isolated Jujutsu workspace (.agy/workspaces/<agent>)"
action = "workspace_inspect"
category = "diagnostics"
args = [
    { name = "agent", required = true, regex = "^[a-zA-Z0-9_-]+$", description = "Subagent name whose isolated workspace should be inspected" }
]
truncate_lines = 250
timeout_seconds = 15

[tools.merge_agent_workspace]
description = "Rebases or squashes an isolated subagent workspace (.agy/workspaces/<agent>) onto @, runs declarative quality gates on the merged tree, and forgets the workspace on success"
action = "workspace_merge"
category = "release"
skip_gates = ["workspace_clean", "linter", "tests"]
mutating = true
args = [
    { name = "agent", required = true, regex = "^[a-zA-Z0-9_-]+$", description = "Subagent name whose isolated workspace should be merged" },
    { name = "strategy", required = false, default = "rebase", regex = "^(rebase|squash)$", description = "Merge strategy: 'rebase' (default) or 'squash'" }
]
truncate_lines = 100
timeout_seconds = 120

[tools.inspect_workspace_clean]
description = "Verifies whether the current Jujutsu workspace (or a specified subagent workspace) has zero uncommitted changes"
action = "parameterized_command"
category = "diagnostics"
command = ["jj", "diff", "--summary", "--color=never"]
args = [
    { name = "workspace_path", required = false, flag = "-R", regex = "^[a-zA-Z0-9_./-]+$", description = "Optional workspace path to inspect (defaults to current workspace)" }
]
empty_fallback = "Clean (0 uncommitted changes)"
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.inspect_git_status]
description = "Inspects Git working tree status (uncommitted, untracked, staged files) via git status --short"
action = "static_command"
category = "diagnostics"
command = ["git", "status", "--short"]
empty_fallback = "Clean (0 uncommitted Git changes)"
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.cargo_doc]
description = "Compiles offline crate documentation and checks for broken intra-doc links via cargo doc --no-deps"
action = "static_command"
category = "release"
skip_gates = ["workspace_clean"]
command = ["cargo", "doc", "--no-deps"]
output_capture = "both"
truncate_lines = 100
timeout_seconds = 120

[tools.cargo_check_targets]
description = "Verifies compilation health of benches and examples (cargo fast check --benches --examples)"
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "fast", "check", "--benches", "--examples"]
output_capture = "both"
truncate_lines = 100
timeout_seconds = 60

[tools.pre_release_gauntlet]
description = "Executes the deterministic pre-release quality gauntlet (VCS conflicts, auto-format, tests, clippy -D warnings, ancillary targets, and docs) in a single pass"
action = "static_command"
category = "release"
tracks_circuit_breaker = true
command = [
    "bash",
    "-c",
    "echo '=== 1. VCS Conflict Check ===' && (git diff --check || (echo 'FAILED: Unresolved VCS conflict markers detected' && exit 1)) && echo 'PASSED: No conflict markers' && echo '=== 2. Codebase Auto-Format ===' && cargo fmt && echo 'PASSED: Formatter executed' && echo '=== 3. Deterministic Nextest ===' && (cargo fast test || cargo test) && echo 'PASSED: All tests green' && echo '=== 4. Pedantic Clippy (-D warnings) ===' && (cargo fast clippy --all-targets -- -D warnings || cargo clippy --all-targets -- -D warnings) && echo 'PASSED: Clippy 0 warnings' && echo '=== 5. Ancillary Targets Check ===' && (cargo fast check --benches --examples || cargo check --benches --examples) && echo 'PASSED: Benches and examples compile' && echo '=== 6. Offline Docs Check ===' && cargo doc --no-deps && echo 'PASSED: Documentation builds without broken links' && echo '=== ALL PRE-RELEASE GAUNTLET CHECKS PASSED ==='"
]
output_capture = "both"
truncate_lines = 150
timeout_seconds = 300
