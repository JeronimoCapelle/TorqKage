# --- Release Automation & High-Level Mathematics Tooling ---

[tools.run_git_cliff]
description = "Generates structured Markdown changelog from Conventional Commits using git-cliff"
action = "static_command"
category = "release"
require_workspace_clean = true
require_clippy_clean = true
require_tests_passed = true
command = ["git-cliff", "--unreleased", "--strip", "header"]
output_capture = "stdout"
truncate_lines = 120
timeout_seconds = 30

[tools.eval_symbolic_math]
description = "Executes exact symbolic mathematics (ODEs, Jacobians, Taylor series, simplifications) via SymPy inside an isolated, network-less Bubblewrap jail"
action = "parameterized_command"
category = "other"
enforce_sandbox = true
command = ["python3", "-c"]
args = [
    { name = "code", required = true, regex = "^[^\\x00]+$", description = "Python expression or multi-line snippet importing sympy to evaluate" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.query_tool_help]
description = "Retrieves live tldr or --help usage for a local CLI binary"
action = "cli_manual"
category = "diagnostics"
sanitize_input = "^[a-zA-Z0-9_-]+$"
truncate_lines = 100
timeout_seconds = 10

[tools.inspect_project_state]
description = "Inspects repository state: active checkpoint (.pipeline/checkpoint.json), uncommitted changes (jj diff --stat), and recent handoff notes"
action = "static_command"
category = "diagnostics"
command = ["agy-hooks", "inspect-state"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.inspect_workspace_diff]
description = "Inspects the active working tree diff (jj diff or git diff) with automatic line truncation"
action = "static_command"
category = "diagnostics"
command = ["jj", "diff"]
output_capture = "stdout"
truncate_lines = 200
timeout_seconds = 10

[tools.inspect_parent_commit]
description = "Inspects the parent commit (@-) metadata, commit message, and full diff in Jujutsu"
action = "static_command"
category = "diagnostics"
command = ["jj", "show", "@-"]
output_capture = "stdout"
truncate_lines = 250
timeout_seconds = 10

[tools.inspect_revision_log]
description = "Displays the recent Jujutsu revision history and change graph with change IDs and descriptions"
action = "static_command"
category = "diagnostics"
command = ["jj", "log", "-n", "10", "--no-graph"]
output_capture = "stdout"
truncate_lines = 100
timeout_seconds = 10

[tools.inspect_workspace_conflicts]
description = "Checks if any commits or files in the Jujutsu repository contain unresolved merge/rebase conflicts"
action = "static_command"
category = "diagnostics"
command = ["jj", "log", "-r", "conflicts()", "--no-graph"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.inspect_bookmarks]
description = "Lists Jujutsu bookmarks (git branches) and their remote tracking status"
action = "static_command"
category = "diagnostics"
command = ["jj", "bookmark", "list"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.jj_absorb_working_copy]
description = "Auto-distributes working copy edits into their closest ancestor commits via Jujutsu absorb"
action = "static_command"
category = "diagnostics"
mutating = true
command = ["jj", "absorb", "--color=never"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.jj_describe_revision]
description = "Sets or updates the commit description message for a Jujutsu revision (defaults to active working copy @)"
action = "parameterized_command"
category = "diagnostics"
mutating = true
command = ["jj", "describe"]
args = [
    { name = "message", required = true, flag = "-m", regex = "^[^\\x00]+$", description = "Commit description message (e.g. 'feat(mcp): add module dependency inspection')" },
    { name = "revision", required = false, flag = "-r", regex = "^[a-zA-Z0-9_@~^.:-]+$", description = "Target revision to describe (defaults to '@')" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.ensure_agent_workspace]
description = "Ensures an isolated Jujutsu workspace exists for a subagent (.workspaces/<agent>), automatically rebasing clean workspaces onto default@ and symlinking the shared build target cache"
action = "parameterized_command"
category = "diagnostics"
command = ["agy-hooks", "ensure-workspace"]
args = [
    { name = "agent", required = true, regex = "^[a-zA-Z0-9_-]+$", description = "Subagent name (e.g. 'coder', 'test-author', 'mini', 'perf-analyst')" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 15

[tools.inspect_workspace_clean]
description = "Verifies whether the current Jujutsu workspace (or a specified subagent workspace) has zero uncommitted changes"
action = "parameterized_command"
category = "diagnostics"
command = ["agy-hooks", "check-clean"]
args = [
    { name = "workspace_path", required = false, regex = "^[a-zA-Z0-9_./-]+$", description = "Optional workspace path to inspect (defaults to current workspace)" }
]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 10

[tools.run_cargo_doc]
description = "Compiles offline crate documentation and checks for broken intra-doc links via cargo doc --no-deps"
action = "static_command"
category = "release"
require_clippy_clean = true
command = ["cargo", "doc", "--no-deps"]
output_capture = "both"
truncate_lines = 100
timeout_seconds = 120

[tools.run_cargo_check_targets]
description = "Verifies compilation health of benches and examples (cargo check --benches --examples)"
action = "static_command"
category = "compilation"
tracks_circuit_breaker = true
command = ["cargo", "check", "--benches", "--examples"]
output_capture = "both"
truncate_lines = 100
timeout_seconds = 60

[tools.run_cargo_fmt]
description = "Formats all workspace source files according to rustfmt style guidelines"
action = "static_command"
category = "compilation"
mutating = true
command = ["cargo", "fmt"]
output_capture = "stdout"
truncate_lines = 50
timeout_seconds = 30
