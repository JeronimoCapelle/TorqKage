name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Release Notes via git-cliff
        run: |
          TAG="${GITHUB_REF_NAME}"
          git-cliff --latest -o CHANGELOG.md || printf "# Changelog\n\n## [%s]\n\nRelease %s\n" "${TAG#v}" "${TAG}" > CHANGELOG.md

      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Upload Assets (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            build_tool: cargo
          - target: x86_64-unknown-linux-musl
            build_tool: cargo-zigbuild
          - target: aarch64-unknown-linux-gnu
            build_tool: cargo-zigbuild
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (clang)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install Rust toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tkg,tkg-mcp,tkg-hooks
          archive: torqkage-$target
          target: ${{ matrix.target }}
          build_tool: ${{ matrix.build_tool }}
          profile: dist
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
