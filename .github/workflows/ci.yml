name: CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.md"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.md"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

env:
  CARGO_TERM_COLOR: always
  # Note: Do not set RUSTFLAGS: "-D warnings" here. Setting RUSTFLAGS in the environment
  # overrides [target.*].rustflags in .cargo/config.toml, which strips --force-warn and
  # breaks the Tier 3 lint architecture. Strict linting is enforced via `cargo clippy`.

jobs:
  sanity:
    name: Sanity & File Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check (no credentials or oversized files)
        run: |
          echo "==> Verifying no sensitive .env files committed..."
          if find . -maxdepth 3 \( -name ".env" -o -name ".env.local" \) | grep -v "/target/" | grep .; then
            echo "::error::Sensitive .env files detected in repository."
            exit 1
          fi

          echo "==> Verifying no oversized binaries (>25MB)..."
          OVERSIZED=$(find . -type f -not -path "*/.*/*" -not -path "./target/*" -size +25M)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files exceeding 25MB detected: $OVERSIZED"
            exit 1
          fi
          echo "==> Sanity checks passed cleanly."

  security-audit:
    name: Supply Chain & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (Nightly / Rust 2024)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Security, License & Banned Dependency Audit (cargo-deny)
        env:
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
        run: cargo deny check

  quality-gate:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (clang, mold)
        run: sudo apt-get update && sudo apt-get install -y clang mold

      - name: Configure kernel parameters for sandbox tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install sccache
        uses: taiki-e/install-action@sccache

      - name: Install Rust toolchain (Nightly / Rust 2024)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "agy-suite-cache"

      - name: Verify code formatting (rustfmt)
        run: cargo fmt --check

      - name: Verify compilation across all workspace crates
        run: cargo check --workspace --all-targets

      - name: Enforce strict pedantic linter clean rules (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute automated unit and integration tests
        run: cargo test --workspace

      - name: Execute documentation tests
        run: cargo test --workspace --doc
