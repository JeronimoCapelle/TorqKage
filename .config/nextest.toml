# ==============================================================================
# .config/nextest.toml — Deterministic Nextest Runner Configuration
# ==============================================================================

[profile.default]
fail-fast = false
retries = 0
status-level = "pass"
final-status-level = "flaky"
slow-timeout = { period = "15s", terminate-after = 2 }

[profile.ci]
fail-fast = true
retries = 1
status-level = "fail"
final-status-level = "fail"
slow-timeout = { period = "30s", terminate-after = 2 }
