# ==============================================================================
# RUSTFMT CONFIGURATION (rustfmt.toml)
# ==============================================================================
# Stable Rustfmt Configuration (100% compatible with Rust 2024 Stable)
# ==============================================================================

# Use Style Guide Edition 2024
style_edition = "2024"

# Enforce POSIX line endings
newline_style = "Unix"

# Alphabetically sort imports and modules
reorder_imports = true
reorder_modules = true

# Consistent diffs: require a trailing comma on multiline match blocks
match_block_trailing_comma = true

# Use `Foo { x, y }` shorthand instead of `Foo { x: x, y: y }`
use_field_init_shorthand = true

# Modern error propagation: rewrite `try!(expr)` to `expr?`
use_try_shorthand = true

# ==============================================================================
# NIGHTLY-ONLY FORMATTING OPTIONS
# ==============================================================================
# Uncomment when running with `cargo +nightly fmt`:
#
# unstable_features = true
# imports_granularity = "Crate"
# group_imports = "StdExternalCrate"
# reorder_impl_items = true
# format_code_in_doc_comments = true
# doc_comment_code_block_width = 100
# normalize_comments = true
# normalize_doc_attributes = true
# format_macro_matchers = true
# format_macro_bodies = true
