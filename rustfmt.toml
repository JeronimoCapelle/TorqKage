# ==============================================================================
# GLOBAL RUSTFMT CONFIGURATION (~/.config/rustfmt/rustfmt.toml)
# ==============================================================================

# Enable unstable features (Nightly toolchain)
unstable_features = true

# Use Style Guide Edition 2024
style_edition = "2024"

# Enforce POSIX line endings
newline_style = "Unix"

# ==============================================================================
# 1. IMPORTS & MODULES
# ==============================================================================
# Merge imports from the same crate into a single `use` statement
imports_granularity = "Crate"

# Group imports into three distinct blocks:
# 1. std, core, and alloc
# 2. External crates (crates.io)
# 3. Local imports (crate, super, self)
group_imports = "StdExternalCrate"

# Alphabetically sort imports and modules within groups
reorder_imports = true
reorder_modules = true

# ==============================================================================
# 2. CODE HYGIENE & TRAILING COMMAS
# ==============================================================================
# Consistent diffs: require a trailing comma on multiline match blocks
match_block_trailing_comma = true

# Use `Foo { x, y }` shorthand instead of `Foo { x: x, y: y }`
use_field_init_shorthand = true

# Modern error propagation: rewrite `try!(expr)` to `expr?`
use_try_shorthand = true

# Order type and const definitions before methods in impl blocks
reorder_impl_items = true

# ==============================================================================
# 3. COMMENTS & DOCUMENTATION
# ==============================================================================
# Automatically format code blocks embedded inside `///` doc comments
format_code_in_doc_comments = true
doc_comment_code_block_width = 100

# Normalize block comments `/* */` to line comments `//` where possible
normalize_comments = true

# Convert `#[doc = "..."]` attributes to `///` markdown doc comments
normalize_doc_attributes = true

# ==============================================================================
# 4. MACROS
# ==============================================================================
# Format declarative macro matching arms ($pattern:ty) and macro bodies
format_macro_matchers = true
format_macro_bodies = true
